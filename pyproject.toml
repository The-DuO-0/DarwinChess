[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darwinchess"
version = "1.0.0"
description = "Persistent self-evolving conversational chess agent for local machines"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DarwinChess Project"}]
dependencies = [
  "chess==1.11.2",
  "numpy>=1.26",
  "torch>=2.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
darwinchess = "darwinchess.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["darwinchess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
