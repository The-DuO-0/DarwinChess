name: DogMatist v2 R&D tests

on:
  push:
    branches:
      - 'v2-*'
  pull_request:
    branches:
      - main
      - v2-league-engine
    paths:
      - 'v2/**'
      - '.github/workflows/v2-rd-tests.yml'

jobs:
  pure-python-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run v2 pure-Python tests
        env:
          PYTHONPATH: v2
        run: python -m pytest -q v2/tests
