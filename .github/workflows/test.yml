name: dog_matist tests

on:
  push:
    branches: [dog-matist-v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,studio]'
      - name: Test core and Studio bridge
        run: python -m pytest
      - name: Import Studio
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import studio.app, studio.backend, studio.pages.play, studio.pages.evolution; print('Studio imports OK')"
